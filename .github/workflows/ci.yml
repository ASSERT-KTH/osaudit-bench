name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.14"
      - run: uv venv && uv pip install -e '.[dev]'   # osaudit from PyPI
      - run: .venv/bin/ruff check .
      - run: .venv/bin/mypy osaudit_bench tests
      - run: .venv/bin/pytest -q --cov=osaudit_bench --cov-report=term-missing
      - run: .venv/bin/osaudit-bench --coverage
